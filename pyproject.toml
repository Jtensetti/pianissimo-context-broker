[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pianissimo-context-broker"
version = "0.3.0"
description = "Local, conservative context controller for Swedish speech recognition"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asr = ["nemo_toolkit[asr]>=2.4,<3"]
live = ["sounddevice>=0.4,<1"]
app = ["gradio>=5.49,<6", "sounddevice>=0.4,<1"]

[project.scripts]
pianissimo-context = "pianissimo_context.cli:main"
pianissimo-app = "pianissimo_context.app:main"

[tool.setuptools.packages.find]
where = ["src"]
